
name: Deploy Kontinenten Python Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/main_kontinenten-rg.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CBA0B6A3EEEF4BD49857D8C0C4E3D2CA }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A16A1A415CF948C49713EDC7AD2700B4 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5D70B8686F1C44DA80288B6ABD6FA510 }}

      - name: Deploy Python backend to Azure
        uses: Azure/functions-action@v1
        with:
          app-name: 'kontinenten-rg'
          package: './backend'
          remote-build: true
